name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm install

      - name: Build the offline game
        run: node tools/build_app.js

      - name: Create the Android project
        run: npx cap add android

      - name: Apply NonoIndo settings
        run: node tools/android_setup.js

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nonoindo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
