<script id="rules">
const PAL = {
  W:'#F7F7F2', G:'#BEC3C8', R:'#CD322D', B:'#825537', b:'#A5734B', Y:'#F0BE3C',
  S:'#AFCDE1', D:'#552D19', K:'#78411E', O:'#B95F1E', T:'#D7AA6E', I:'#E1F0F5', P:'#C8E1EB'
};
const CATEGORIES = window.PACKS || [];
const PUZZLES = CATEGORIES.flatMap(c => c.puzzles.map(p => (p.cat = c.id, p)));
const catOf = id => CATEGORIES.find(c => c.id === id);
const EMPTY = 0, FILL = 1, CROSSED = 2;
let N = 10; // Grid size of the puzzle being played; set when a puzzle opens.

const runs = line => {
  const out = []; let n = 0;
  for (const v of line) { if (v) n++; else if (n) { out.push(n); n = 0; } }
  if (n) out.push(n);
  return out;
};
const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const blankGrid = () => Array.from({ length: N }, () => Array(N).fill(EMPTY));

for (const p of PUZZLES) {
  const bin = p.art.map(r => [...r].map(c => c === '.' ? 0 : 1));
  p.rows = bin.map(runs);
  p.cols = bin[0].map((_, c) => runs(bin.map(r => r[c])));
}

class Board {
  constructor(puzzle, grid) {
    this.puzzle = puzzle;
    this.grid = grid ? grid.map(r => r.slice()) : blankGrid();
    this.undoStack = [];
    this.stroke = null;
  }
  lineDone(i, isRow) {
    const line = isRow ? this.grid[i] : this.grid.map(r => r[i]);
    return same(runs(line.map(v => v === FILL ? 1 : 0)), isRow ? this.puzzle.rows[i] : this.puzzle.cols[i]);
  }
  isWon() {
    for (let i = 0; i < N; i++) if (!this.lineDone(i, true) || !this.lineDone(i, false)) return false;
    return true;
  }
  pushUndo() {
    this.undoStack.push(this.grid.map(r => r.slice()));
    if (this.undoStack.length > 200) this.undoStack.shift();
  }
  undo() {
    const prev = this.undoStack.pop();
    if (prev) this.grid = prev;
  }
  reset() {
    this.pushUndo();
    this.grid = blankGrid();
  }
  apply(p) {
    if (this.grid[p.r][p.c] !== this.stroke.startV) return;
    this.grid[p.r][p.c] = this.stroke.paint;
    this.stroke.changed++;
  }
  begin(p, tool) {
    const startV = this.grid[p.r][p.c];
    this.pushUndo();
    this.stroke = { startV, paint: startV === tool ? EMPTY : tool, last: p, origin: p, axis: null, changed: 0, heard: 0 };
    this.apply(p);
  }
  move(p) {
    const s = this.stroke;
    if (!s.axis && (p.r !== s.origin.r || p.c !== s.origin.c)) {
      s.axis = Math.abs(p.c - s.origin.c) >= Math.abs(p.r - s.origin.r) ? 'h' : 'v';
    }
    if (s.axis === 'h') p = { r: s.origin.r, c: p.c };
    if (s.axis === 'v') p = { r: p.r, c: s.origin.c };
    const steps = Math.max(Math.abs(p.r - s.last.r), Math.abs(p.c - s.last.c));
    for (let i = 1; i <= steps; i++) {
      this.apply({
        r: s.last.r + Math.round((p.r - s.last.r) * i / steps),
        c: s.last.c + Math.round((p.c - s.last.c) * i / steps),
      });
    }
    s.last = p;
    return p;
  }
  end() { this.stroke = null; }
}
</script>

// Everything here needs Phaser, which loads afterwards, so it runs inside start().
function start() {
const VW = 1080, VH = 1920, MARGIN = 54, CONTENT = VW - MARGIN * 2;
const BOARD_Y = 200;
const hex = s => parseInt(s.slice(1), 16);
const C = { blue:'#173FA3', deep:'#0F2C78', yellow:'#FFCB2E', red:'#E23A2E', paper:'#FFF9E8', ink:'#14204D', soft:'#C9D6FF', line:'#C9C2AB', hi:'#FFE9A3', filled:'#2F6FDE' };
const DISPLAY = '"Bungee", "Arial Black", sans-serif', BODY = '"Figtree", system-ui, sans-serif';
const KEY = 'nonoindo.phaser.v1';

const store = {
  read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  write(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
};
const save = store.read();
save.best = save.best || {};
save.grids = save.grids || {};
save.lang = save.lang === 'en' ? 'en' : 'id';

const I18N = {
  en: {
    'Lanjut':'Continue','Baru':'New','Opsi':'Options','Kembali':'Back','Koleksi':'Collection',

    'Geser jari untuk mengisi banyak kotak sekaligus. Ketuk angka untuk mengunci satu baris atau kolom.':'Drag your finger to fill many squares at once. Tap the numbers to lock one row or column.',
    'Ulang puzzle ini?':'Reset this puzzle?','Semua kotak akan dikosongkan.':'All squares will be cleared.','Batal':'Cancel',
    'Selesai!':'Done!','Waktu':'Time','rekor baru':'new best','rekor':'best',
    'Main lagi':'Play again','Lihat koleksi':'View collection',
    'Bahasa':'Language','Kategori':'Categories','Segera hadir':'Coming soon',
  },
};
const t = k => (save.lang === 'en' && I18N.en[k]) || k;
const catName = c => c.name[save.lang] || c.name.id;

// Short sounds made in the browser, so the game needs no audio files.
const sfx = (() => {
  let ctx = null, last = 0;
  const unlock = () => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) { try { ctx = new AC(); } catch { return; } }
    if (ctx.state === 'suspended') ctx.resume();
  };
  ['pointerdown', 'pointerup', 'touchend', 'keydown'].forEach(e => document.addEventListener(e, unlock, { passive: true }));
  const blip = (type, from, to, dur, vol) => {
    if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    if (now - last < 0.04) return;
    last = now;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, now);
    osc.frequency.exponentialRampToValueAtTime(to, now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur);
  };
  return {
    [FILL]: () => blip('triangle', 300, 130, 0.1, 0.4),
    [CROSSED]: () => blip('square', 1500, 900, 0.05, 0.1),
    [EMPTY]: () => blip('sine', 520, 340, 0.05, 0.12),
  };
})();

function label(scene, x, y, text, opts = {}) {
  const style = {
    fontFamily: opts.display ? DISPLAY : BODY,
    fontStyle: opts.weight || (opts.display ? '400' : '500'),
    fontSize: `${opts.size || 42}px`,
    color: opts.color || C.paper,
    align: opts.align || 'left',
  };
  if (opts.wrap) style.wordWrap = { width: opts.wrap };
  const t = scene.add.text(x, y, text, style);
  if (opts.lineSpacing) t.setLineSpacing(opts.lineSpacing);
  if (opts.shadow) t.setShadow(opts.shadow, opts.shadow, C.red, 0, false, true);
  return t;
}

function button(scene, x, y, w, h, text, onClick, opts = {}) {
  const look = { fill: hex(opts.fill || C.deep), strokeW: 0, strokeC: 0 };
  const gfx = scene.add.graphics();
  const draw = () => {
    const pad = look.strokeW / 2, rad = (h - look.strokeW) / 2;
    gfx.clear();
    gfx.fillStyle(look.fill, 1);
    gfx.fillRoundedRect(x + pad, y + pad, w - look.strokeW, h - look.strokeW, rad);
    if (look.strokeW) {
      gfx.lineStyle(look.strokeW, look.strokeC, 1);
      gfx.strokeRoundedRect(x + pad, y + pad, w - look.strokeW, h - look.strokeW, rad);
    }
  };
  draw();
  const txt = label(scene, x + w / 2, y + h / 2, text, { size: opts.size || 42, weight: '800', color: opts.color || C.paper }).setOrigin(0.5);
  const hit = scene.add.zone(x + w / 2, y + h / 2, w, h).setInteractive({ useHandCursor: true });
  const b = {
    txt, enabled: true, onClick,
    rect: {
      setStrokeStyle(width, color) { look.strokeW = width; look.strokeC = color; draw(); },
      setFillStyle(color) { look.fill = color; draw(); },
    },
    setEnabled(v) { b.enabled = v; gfx.setAlpha(v ? 1 : 0.45); txt.setAlpha(v ? 1 : 0.45); return b; },
    setLook(fill, color) { look.fill = hex(fill); draw(); txt.setColor(color); return b; },
    setVisible(v) { gfx.setVisible(v); txt.setVisible(v); hit.input.enabled = v; return b; },
    setDepth(d) { gfx.setDepth(d); txt.setDepth(d); hit.setDepth(d); return b; },
    destroy() { gfx.destroy(); txt.destroy(); hit.destroy(); },
    press() { if (b.enabled) onClick(); },
  };
  hit.on('pointerup', () => b.press());
  return b;
}

function artTexture(scene, p) {
  const key = `art-${p.id}`;
  if (scene.textures.exists(key)) return key;
  const size = p.art.length, colors = p.pal || PAL;
  const tex = scene.textures.createCanvas(key, size, size);
  const ctx = tex.getContext();
  ctx.fillStyle = p.bg; ctx.fillRect(0, 0, size, size);
  p.art.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '.') return;
    ctx.fillStyle = colors[ch]; ctx.fillRect(c, r, 1, 1);
  }));
  tex.refresh();
  tex.setFilter(Phaser.Textures.FilterMode.NEAREST);
  return key;
}

class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }
  init(data) {
    this.puzzle = data.puzzle;
    N = this.puzzle.art.length;
    const saved = !data.fresh && save.grids[this.puzzle.id];
    save.last = this.puzzle.id; store.write(save);
    this.board = new Board(this.puzzle, saved && saved.g);
    this.elapsed = saved ? saved.t : 0;
    this.tool = FILL; this.done = false; this.focus = null; this.keyCursor = false; this.lock = null; this.dialog = null;
  }
  create() {
    const p = this.puzzle;
    this.btn = {};
    this.btn.back = button(this, MARGIN, 40, 240, 110, t('Kembali'), () => this.toHome(), { size: 38 });
    this.titleText = label(this, VW / 2, 95, `Puzzle ${catOf(p.cat).puzzles.indexOf(p) + 1}`, { display: true, size: 46, color: C.yellow }).setOrigin(0.5);
    this.clock = label(this, VW - MARGIN, 95, fmt(this.elapsed), { size: 46, weight: '800' }).setOrigin(1, 0.5);

    const depth = Math.max(1, ...p.rows.map(c => c.length), ...p.cols.map(c => c.length));
    const cell = Math.floor(CONTENT / (N + depth * 0.6));
    this.geo = { cell, ox: MARGIN + CONTENT - cell * N, oy: BOARD_Y + CONTENT - cell * N };

    this.add.rectangle(VW / 2, BOARD_Y + CONTENT / 2, CONTENT, CONTENT, hex(C.paper));
    this.gfx = this.add.graphics().setDepth(1);
    this.buildClues();

    const ty = BOARD_Y + CONTENT + 36, half = (CONTENT - 30) / 2;
    this.btn.fill = button(this, MARGIN, ty, half, 140, t('Isi'), () => this.setTool(FILL), { size: 46 });
    this.btn.cross = button(this, MARGIN + half + 30, ty, half, 140, t('Silang'), () => this.setTool(CROSSED), { size: 46 });
    const ay = ty + 170, aw = (CONTENT - 30) / 2;
    this.btn.undo = button(this, MARGIN, ay, aw, 124, t('Urungkan'), () => this.doUndo());
    this.btn.reset = button(this, MARGIN + aw + 30, ay, aw, 124, t('Ulang'), () => this.askReset());
    this.btn.undo.setEnabled(false);
    this.note = label(this, MARGIN, ay + 150, t('Geser jari untuk mengisi banyak kotak sekaligus. Ketuk angka untuk mengunci satu baris atau kolom.'), { size: 36, color: C.soft, wrap: CONTENT, lineSpacing: 6 });
    this.setTool(FILL);

    this.input.on('pointerdown', q => this.onDown(q));
    this.input.on('pointermove', q => this.onMove(q));
    this.input.on('pointerup', () => this.onUp());
    this.input.on('pointerupoutside', () => this.onUp());
    this.input.keyboard && this.input.keyboard.on('keydown', e => this.onKey(e));

    this.ticker = this.time.addEvent({ delay: 1000, loop: true, callback: () => {
      if (this.done) return;
      this.elapsed++;
      this.clock.setText(fmt(this.elapsed));
      if (this.elapsed % 5 === 0) this.persist();
    } });

    this.events.once('shutdown', () => this.persist());
    this.paint();
  }

  buildClues() {
    const { cell, ox, oy } = this.geo, p = this.puzzle;
    const size = Math.round(cell * 0.56);
    const style = { size, weight: '800', color: C.ink };
    this.rowClues = []; this.colClues = [];
    for (let r = 0; r < N; r++) {
      const clue = p.rows[r].length ? p.rows[r] : [0];
      this.rowClues[r] = clue.slice().reverse().map((n, i) =>
        label(this, ox - cell * 0.18 - i * cell * 0.56, oy + r * cell + cell * 0.5, String(n), style).setOrigin(1, 0.5).setDepth(2));
    }
    for (let c = 0; c < N; c++) {
      const clue = p.cols[c].length ? p.cols[c] : [0];
      this.colClues[c] = clue.slice().reverse().map((n, i) =>
        label(this, ox + c * cell + cell / 2, oy - cell * 0.34 - i * cell * 0.62, String(n), style).setOrigin(0.5).setDepth(2));
    }
  }

  paint() {
    const g = this.gfx, { cell, ox, oy } = this.geo, grid = this.board.grid;
    g.clear();
    if (this.lock) {
      g.fillStyle(hex(C.yellow), 1);
      if (this.lock.type === 'row') g.fillRect(MARGIN, oy + this.lock.i * cell, CONTENT, cell);
      else g.fillRect(ox + this.lock.i * cell, BOARD_Y, cell, CONTENT);
    } else if (this.focus) {
      g.fillStyle(hex(C.hi), 1);
      g.fillRect(MARGIN, oy + this.focus.r * cell, CONTENT, cell);
      g.fillRect(ox + this.focus.c * cell, BOARD_Y, cell, CONTENT);
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = ox + c * cell, y = oy + r * cell, v = grid[r][c];
      if (v === FILL) { g.fillStyle(hex(C.filled), 1); g.fillRect(x, y, cell, cell); }
      if (v === CROSSED) {
        const m = cell * 0.28;
        g.lineStyle(Math.max(4, cell * 0.09), hex(C.red), 1);
        g.lineBetween(x + m, y + m, x + cell - m, y + cell - m);
        g.lineBetween(x + cell - m, y + m, x + m, y + cell - m);
      }
    }
    for (const major of [false, true]) {
      g.lineStyle(major ? 5 : 2, hex(major ? C.ink : C.line), 1);
      for (let i = 0; i <= N; i++) {
        if ((i % 5 === 0) !== major) continue;
        g.lineBetween(ox + i * cell, oy, ox + i * cell, oy + cell * N);
        g.lineBetween(ox, oy + i * cell, ox + cell * N, oy + i * cell);
      }
    }
    if (this.lock) {
      const size = cell * N, i = this.lock.i, row = this.lock.type === 'row';
      g.fillStyle(hex(C.paper), 0.55);
      if (row) {
        g.fillRect(ox, oy, size, i * cell);
        g.fillRect(ox, oy + (i + 1) * cell, size, (N - i - 1) * cell);
      } else {
        g.fillRect(ox, oy, i * cell, size);
        g.fillRect(ox + (i + 1) * cell, oy, (N - i - 1) * cell, size);
      }
      g.lineStyle(6, hex(C.red), 1);
      if (row) g.strokeRect(ox, oy + i * cell, size, cell);
      else g.strokeRect(ox + i * cell, oy, cell, size);
    }
    if (this.keyCursor && this.focus) {
      g.lineStyle(6, hex(C.red), 1);
      g.strokeRect(ox + this.focus.c * cell, oy + this.focus.r * cell, cell, cell);
    }
    for (let i = 0; i < N; i++) {
      const ra = this.board.lineDone(i, true) ? 0.32 : 1, ca = this.board.lineDone(i, false) ? 0.32 : 1;
      this.rowClues[i].forEach(t => t.setAlpha(ra));
      this.colClues[i].forEach(t => t.setAlpha(ca));
    }
  }

  cellAt(q) {
    const { cell, ox, oy } = this.geo;
    return { c: Math.floor((q.worldX - ox) / cell), r: Math.floor((q.worldY - oy) / cell) };
  }
  inLock(p) {
    if (!this.lock) return true;
    return this.lock.type === 'row' ? p.r === this.lock.i : p.c === this.lock.i;
  }
  toggleLock(type, i) {
    const same = this.lock && this.lock.type === type && this.lock.i === i;
    this.lock = same ? null : { type, i };
    this.focus = null;
    this.paint();
  }
  beginStroke(p) {
    this.board.begin(p, this.tool);
    if (this.lock) this.board.stroke.axis = this.lock.type === 'row' ? 'h' : 'v';
  }
  onDown(q) {
    if (this.done || this.dialog) return;
    const p = this.cellAt(q);
    const inRows = p.r >= 0 && p.r < N, inCols = p.c >= 0 && p.c < N;
    if (p.c < 0 && inRows && q.worldX >= MARGIN) return this.toggleLock('row', p.r);
    if (p.r < 0 && inCols && q.worldY >= BOARD_Y) return this.toggleLock('col', p.c);
    if (!inRows || !inCols || !this.inLock(p)) return;
    this.keyCursor = false; this.focus = p;
    this.beginStroke(p);
    this.strokeSound();
    this.btn.undo.setEnabled(true);
    this.paint();
  }
  strokeSound() {
    const s = this.board.stroke;
    if (s.changed > s.heard) { s.heard = s.changed; sfx[s.paint](); }
  }
  onMove(q) {
    if (!this.board.stroke) return;
    const p = this.cellAt(q);
    this.focus = this.board.move({ r: Phaser.Math.Clamp(p.r, 0, N - 1), c: Phaser.Math.Clamp(p.c, 0, N - 1) });
    this.strokeSound();
    this.paint();
  }
  onUp() {
    if (!this.board.stroke) return;
    this.board.end();
    this.persist();
    this.paint();
    if (this.board.isWon()) this.win();
  }
  onKey(e) {
    if (this.done || this.dialog) return;
    const dir = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] }[e.key];
    const clamp = v => Math.min(N - 1, Math.max(0, v));
    if (dir) {
      e.preventDefault();
      this.keyCursor = true;
      this.focus = this.focus ? { r: clamp(this.focus.r + dir[0]), c: clamp(this.focus.c + dir[1]) } : { r: 0, c: 0 };
      this.paint();
    } else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      this.keyCursor = true;
      this.focus = this.focus || { r: 0, c: 0 };
      if (!this.inLock(this.focus)) return;
      this.beginStroke(this.focus);
      this.strokeSound();
      this.btn.undo.setEnabled(true);
      this.onUp();
    }
  }

  setTool(t2) {
    this.tool = t2;
    const look = (b, name, on) => {
      b.setLook(on ? C.yellow : C.deep, on ? C.ink : C.soft);
      b.txt.setText(on ? `✓ ${name}` : name);
    };
    look(this.btn.fill, t('Isi'), t2 === FILL);
    look(this.btn.cross, t('Silang'), t2 === CROSSED);
  }
  doUndo() {
    this.board.undo();
    this.btn.undo.setEnabled(this.board.undoStack.length > 0);
    this.persist(); this.paint();
  }
  askReset() {
    if (this.dialog) return;
    const w = 860, h = 500, x = (VW - w) / 2, y = BOARD_Y + 240, bw = 355, by = y + h - 170;
    const shade = this.add.rectangle(VW / 2, VH / 2, VW, VH, 0x000000, 0.6).setDepth(10).setInteractive();
    const panel = this.add.graphics().setDepth(11);
    panel.fillStyle(hex(C.deep), 1).fillRoundedRect(x, y, w, h, 40);
    panel.lineStyle(8, hex(C.yellow), 1).strokeRoundedRect(x, y, w, h, 40);
    const title = label(this, VW / 2, y + 110, t('Ulang puzzle ini?'), { display: true, size: 54, color: C.yellow }).setOrigin(0.5).setDepth(12);
    const body = label(this, VW / 2, y + 210, t('Semua kotak akan dikosongkan.'), { size: 42, color: C.paper }).setOrigin(0.5).setDepth(12);
    const close = () => {
      [shade, panel, title, body].forEach(o => o.destroy());
      no.destroy(); yes.destroy();
      this.dialog = null;
    };
    const no = button(this, x + 50, by, bw, 120, t('Batal'), close).setDepth(12);
    const yes = button(this, x + w - 50 - bw, by, bw, 120, t('Ulang'), () => { close(); this.doReset(); }, { fill: C.red }).setDepth(12);
    this.dialog = { no, yes };
  }
  doReset() {
    this.board.reset();
    this.btn.undo.setEnabled(true);
    this.persist(); this.paint();
  }
  persist() {
    if (this.done) return;
    save.grids[this.puzzle.id] = { g: this.board.grid, t: this.elapsed };
    store.write(save);
  }
  toHome() { this.scene.start('Home', { cat: this.puzzle.cat }); }

  win() {
    this.done = true;
    this.ticker.remove();
    const id = this.puzzle.id, best = save.best[id], isBest = best === undefined || this.elapsed < best;
    if (isBest) save.best[id] = this.elapsed;
    delete save.grids[id];
    store.write(save);
    this.focus = null;
    this.titleText.setText(t('Selesai!'));
    ['fill', 'cross', 'undo', 'reset'].forEach(k => this.btn[k].setVisible(false));
    this.note.setVisible(false);
    this.result = isBest ? `${t('Waktu')} ${fmt(this.elapsed)} · ${t('rekor baru')}` : `${t('Waktu')} ${fmt(this.elapsed)} · ${t('rekor')} ${fmt(best)}`;

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      this.gfx.clear();
      [...this.rowClues, ...this.colClues].flat().forEach(t => t.setVisible(false));
      this.add.image(VW / 2, BOARD_Y + CONTENT / 2, artTexture(this, this.puzzle)).setDisplaySize(CONTENT, CONTENT).setDepth(3);
      this.showResult();
      return;
    }
    this.playReveal();
  }

  playReveal() {
    const { cell, ox, oy } = this.geo, p = this.puzzle, half = cell * N / 2;
    const stage = this.add.container(ox + half, oy + half).setDepth(3);
    const grid = this.board.grid;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = c * cell + cell / 2 - half, y = r * cell + cell / 2 - half, ch = p.art[r][c];
      const under = this.add.rectangle(x, y, cell + 1, cell + 1, hex(grid[r][c] === FILL ? C.filled : C.paper));
      const top = this.add.rectangle(x, y, cell + 1, cell + 1, hex(ch === '.' ? p.bg : (p.pal || PAL)[ch])).setScale(0);
      stage.add([under, top]);
      const mid = (N - 1) / 2, d = Math.hypot(r - mid, c - mid) / (mid * 1.42);
      this.tweens.add({ targets: top, scale: 1, delay: d * 550, duration: 280, ease: 'Back.easeOut' });
    }
    this.gfx.clear();
    this.tweens.add({ targets: [...this.rowClues, ...this.colClues].flat(), alpha: 0, duration: 300 });
    this.tweens.add({
      targets: stage, x: VW / 2, y: BOARD_Y + CONTENT / 2, scale: CONTENT / (cell * N),
      delay: 850, duration: 450, ease: 'Cubic.easeOut',
      onComplete: () => { this.confetti(); this.showResult(); },
    });
  }

  confetti() {
    if (!this.textures.exists('confetti')) {
      const t = this.textures.createCanvas('confetti', 14, 14);
      const x = t.getContext(); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 14, 14); t.refresh();
    }
    const em = this.add.particles(VW / 2, BOARD_Y + CONTENT / 2, 'confetti', {
      speed: { min: 350, max: 1000 }, angle: { min: 0, max: 360 }, gravityY: 1100,
      lifespan: 1200, scale: { start: 1.3, end: 0.3 }, rotate: { min: 0, max: 360 },
      tint: [hex(C.yellow), hex(C.red), hex(C.paper), hex(this.puzzle.bg)], emitting: false,
    }).setDepth(4);
    em.explode(70);
  }

  showResult() {
    const p = this.puzzle, y = BOARD_Y + CONTENT + 36, list = catOf(p.cat).puzzles, idx = list.indexOf(p);
    label(this, MARGIN, y, p.name, { display: true, size: 74, color: C.yellow, shadow: 5 });
    label(this, MARGIN, y + 100, p.caption, { size: 46, weight: '700', wrap: CONTENT, lineSpacing: 6 });
    label(this, MARGIN, y + 250, this.result, { size: 38, color: C.soft });
    const by = y + 320, w = (CONTENT - 30) / 2;
    this.btn.again = button(this, MARGIN, by, w, 124, t('Main lagi'), () => this.scene.restart({ puzzle: p, fresh: true }));
    this.btn.next = button(this, MARGIN + w + 30, by, w, 124, idx < list.length - 1 ? t('Lanjut') : t('Lihat koleksi'), () => {
      const n = list[idx + 1];
      if (n) this.scene.start('Play', { puzzle: n, fresh: save.best[n.id] !== undefined });
      else this.toHome();
    }, { fill: C.yellow, color: C.ink });
  }
}

function boot() {
  window.nonoGame = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: VW, height: VH,
    backgroundColor: C.blue,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 2 },
    banner: false,
    scene: [TitleScene, OptionsScene, CategoriesScene, HomeScene, PlayScene],
  });
}
boot();
}
</script>

<script>
(() => {
  const urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js',
    'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js',
  ];
  const fail = () => { document.getElementById('fail').hidden = false; };
  const startGame = () => Promise.all([fontsReady, titleReady]).then(() => {
    try { start(); } catch (e) { console.error(e); fail(); }
  });
  function load(i) {
    if (i >= urls.length) return fail();
    const s = document.createElement('script');
    s.src = urls[i];
    s.onload = startGame;
    s.onerror = () => load(i + 1);
    document.head.append(s);
  }
  load(0);
})();
</script>
</body>
</html>
