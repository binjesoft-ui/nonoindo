<script id="rules">
const PAL = {
  W:'#F7F7F2', G:'#BEC3C8', R:'#CD322D', B:'#825537', b:'#A5734B', Y:'#F0BE3C',
  S:'#AFCDE1', D:'#552D19', K:'#78411E', O:'#B95F1E', T:'#D7AA6E', I:'#E1F0F5', P:'#C8E1EB'
};
const CATEGORIES = window.PACKS || [];
const PUZZLES = CATEGORIES.flatMap(c => c.puzzles.map(p => (p.cat = c.id, p)));
const catOf = id => CATEGORIES.find(c => c.id === id);
const EMPTY = 0, FILL = 1, CROSSED = 2;
let N = 10; // Grid size of the puzzle being played; set when a puzzle opens.

const runs = line => {
  const out = []; let n = 0;
  for (const v of line) { if (v) n++; else if (n) { out.push(n); n = 0; } }
  if (n) out.push(n);
  return out;
};
const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const blankGrid = () => Array.from({ length: N }, () => Array(N).fill(EMPTY));

for (const p of PUZZLES) {
  const bin = p.art.map(r => [...r].map(c => c === '.' ? 0 : 1));
  p.rows = bin.map(runs);
  p.cols = bin[0].map((_, c) => runs(bin.map(r => r[c])));
}

// Guide pages for Opsi. A demo draws a small 5x5 board; marks use # filled, x crossed, * newly filled.

        demo:{ marks:['.....', '*****', '*****', '.....', '.....'], row:1, arrow:[[1, 0], [1, 4]] } },
      { title:{ id:'Cari yang pasti bertumpuk', en:'Find the overlap' },
        text:{ id:'Angka 4 di garis 5 kotak bisa mulai dari atas atau dari bawah. Dua posisi itu selalu bertumpuk di tiga kotak tengah, jadi tiga kotak itu pasti terisi.', en:'A 4 on a line of 5 can start at the top or one square lower. Both positions always cover the middle three squares, so those are certain.' },

// Original NonoIndo music, written as data and played by small synth voices.
const MUSIC = (() => {
  const NOTE = { C:0, 'C#':1, Db:1, D:2, 'D#':3, Eb:3, E:4, F:5, 'F#':6, Gb:6, G:7, 'G#':8, Ab:8, A:9, 'A#':10, Bb:10, B:11 };
  const SHAPES = { '':[0,4,7], m:[0,3,7], '7':[0,4,7,10], m7:[0,3,7,10], maj7:[0,4,7,11] };
  const midi = n => { const m = n.match(/^([A-G][#b]?)(\d)$/); return 12 * (+m[2] + 1) + NOTE[m[1]]; };
  const hz = m => 440 * 2 ** ((m - 69) / 12);
  const chord = (name, oct) => {
    const m = name.match(/^([A-G][#b]?)(.*)$/), root = 12 * (oct + 1) + NOTE[m[1]];
    return SHAPES[m[2]].map(i => root + i);
  };
  const noiseFor = new WeakMap();
  const noise = ctx => {
    if (!noiseFor.has(ctx)) {
      const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      noiseFor.set(ctx, buf);
    }
    return noiseFor.get(ctx);
  };
  const env = (ctx, out, t, vol, dur, attack = 0.006) => {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(out);
    return g;
  };
  const tone = (ctx, out, type, f, t, vol, dur, attack, cutoff) => {
    const osc = ctx.createOscillator(), g = env(ctx, out, t, vol, dur, attack);
    osc.type = type; osc.frequency.value = f;
    if (cutoff) {
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = cutoff;
      osc.connect(lp).connect(g);
    } else osc.connect(g);
    osc.start(t); osc.stop(t + dur + 0.02);
    return osc;
  };
  const voices = {
    bell: (c, o, m, t, v, d) => { tone(c, o, 'sine', hz(m), t, v, d + 0.3); tone(c, o, 'sine', hz(m) * 3, t, v * 0.18, 0.25); },
    flute: (c, o, m, t, v, d) => {
      const osc = tone(c, o, 'sine', hz(m), t, v, d + 0.12, 0.05);
      const lfo = c.createOscillator(), depth = c.createGain();
      lfo.frequency.value = 5; depth.gain.value = 3;
      lfo.connect(depth).connect(osc.frequency);
      lfo.start(t); lfo.stop(t + d + 0.14);
      tone(c, o, 'sine', hz(m) * 2, t, v * 0.12, d, 0.05);
    },
    piano: (c, o, m, t, v, d) => {
      tone(c, o, 'sine', hz(m), t, v, d, 0.005);
      tone(c, o, 'sine', hz(m) * 2, t, v * 0.4, d * 0.6, 0.005);
      tone(c, o, 'sine', hz(m) * 3, t, v * 0.14, d * 0.3, 0.005);
    },
    keys: (c, o, m, t, v, d) => {
      tone(c, o, 'sine', hz(m), t, v, d, 0.012);
      tone(c, o, 'triangle', hz(m) * 2, t, v * 0.16, d * 0.5, 0.012);
    },
    lead: (c, o, m, t, v, d) => {
      tone(c, o, 'triangle', hz(m), t, v, d + 0.15, 0.015);
      tone(c, o, 'sine', hz(m) * 2, t, v * 0.2, d, 0.015);
    },
    pluck: (c, o, m, t, v, d) => tone(c, o, 'triangle', hz(m), t, v, d, 0.004, 2200),
    bass: (c, o, m, t, v, d) => tone(c, o, 'triangle', hz(m), t, v, d, 0.01, 420),
    pad: (c, o, m, t, v, d) => {
      tone(c, o, 'sawtooth', hz(m) * 0.998, t, v, d, 0.3, 800);
      tone(c, o, 'sawtooth', hz(m) * 1.002, t, v, d, 0.3, 800);
    },
  };
  const hit = (c, o, t, v, d, type, f) => {
    const src = c.createBufferSource(), flt = c.createBiquadFilter();
    src.buffer = noise(c); flt.type = type; flt.frequency.value = f;
    src.connect(flt).connect(env(c, o, t, v, d, 0.002));
    src.start(t, Math.random() * 0.5); src.stop(t + d + 0.02);
  };
  const kick = (c, o, t, v) => {
    const osc = c.createOscillator(), g = env(c, o, t, v, 0.26, 0.003);
    osc.frequency.setValueAtTime(130, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    osc.connect(g); osc.start(t); osc.stop(t + 0.3);
  };
  const snare = (c, o, t, v) => hit(c, o, t, v, 0.16, 'bandpass', 1800);
  const hat = (c, o, t, v) => hit(c, o, t, v, 0.04, 'highpass', 7000);

  const TRACKS = [
    { id:'anak', name:{ id:'Anak', en:'Kids' }, bpm:132, lead:'bell', vol:0.26, level:1,
      chords:['C','F','G','C','C','F','G','C'],
      melody:['E5 G5 A5 G5 E5 . C5 .','F5 A5 G5 F5 E5 . . .','D5 E5 F5 G5 A5 . G5 .','E5 D5 C5 D5 E5 . . .',
              'C5 C5 E5 G5 C6 . A5 .','A5 G5 F5 A5 G5 . . .','F5 E5 D5 E5 F5 . D5 .','C5 . E5 . C5 . . .'],
      back(c, o, ch, s, t, d, pass) {
        const n = chord(ch, 3);
        if (s === 0) voices.bass(c, o, n[0] - 12, t, 0.3, d * 1.8);
        if (s === 4) voices.bass(c, o, n[2] - 12, t, 0.26, d * 1.8);
        if (s === 2 || s === 6) n.forEach(m => voices.pluck(c, o, m + 12, t, 0.08, d * 1.4));
        if (s % 2 === 0) hat(c, o, t, 0.035);
        if (pass === 1 && (s === 6 || s === 7)) voices.bell(c, o, midi('E6'), t, 0.07, 0.2); // Spoon tapping a bakso bowl.
      } },
    { id:'nusantara', name:{ id:'Nusantara', en:'Nusantara' }, bpm:104, lead:'flute', vol:0.2, level:1,
      chords:['G','Em','C','D','G','C','D','G'],
      melody:['B4 D5 E5 D5 B4 . G4 .','G4 A4 B4 D5 E5 . . .','E5 G5 E5 D5 C5 . E5 .','D5 C5 B4 A4 D5 . . .',
              'B4 D5 G5 . F#5 E5 D5 .','E5 . C5 E5 D5 C5 B4 .','A4 B4 C5 A4 D5 . F#5 .','G5 . D5 . G4 . . .'],
      back(c, o, ch, s, t, d) {
        const n = chord(ch, 3);
        if (s === 0) { voices.bass(c, o, n[0] - 12, t, 0.3, d * 2.5); kick(c, o, t, 0.2); }
        if (s === 3) kick(c, o, t, 0.14);
        if ([2, 3, 5, 6].includes(s)) n.forEach((m, i) => voices.pluck(c, o, m + 12, t + i * 0.012, 0.09, d * 1.6));
        if (s === 4) voices.bass(c, o, n[2] - 12, t, 0.22, d * 1.8);
      } },
    { id:'piano', name:{ id:'Piano', en:'Piano' }, bpm:66, lead:'piano', vol:0.2, level:1,
      chords:['Cmaj7','Am7','Fmaj7','G','Em7','Am7','Dm7','G'],
      melody:['E5 . . . G5 . . .','E5 . . . C5 . . .','A4 . C5 . F5 . . .','D5 . . . . . B4 .',
              'G5 . . . B4 . . .','C5 . E5 . A5 . . .','F5 . E5 . D5 . . .','G4 . B4 . D5 . . .'],
      back(c, o, ch, s, t) {
        const n = chord(ch, 3), order = [0, 2, 1, 2, n.length - 1, 2, 1, 2];
        voices.piano(c, o, n[order[s]], t, s === 0 ? 0.13 : 0.09, 1.8);
        if (s === 0) voices.piano(c, o, n[0] - 12, t, 0.12, 3);
      } },
    { id:'rnb', name:{ id:'R&B', en:'R&B' }, bpm:72, lead:'keys', vol:0.2, level:1,
      chords:['Dm7','G7','Cmaj7','Am7','Fmaj7','Em7','Dm7','G7'],
      melody:['. A4 C5 . D5 . . C5','B4 . . G4 A4 B4 . .','. E5 D5 . C5 . B4 .','C5 . A4 . . . . .',
              '. A4 C5 . E5 . D5 C5','B4 . G4 . B4 D5 . .','. F5 E5 D5 C5 . A4 .','B4 . . . . . . .'],
      back(c, o, ch, s, t, d) {
        const n = chord(ch, 3);
        if (s === 0) { n.forEach(m => voices.keys(c, o, m + 12, t, 0.07, d * 3.5)); n.slice(0, 3).forEach(m => voices.pad(c, o, m, t, 0.018, d * 8)); }
        if (s === 3) n.slice(1).forEach(m => voices.keys(c, o, m + 12, t, 0.05, d * 1.5));
        if (s === 0 || s === 3 || s === 6) { kick(c, o, t, s === 0 ? 0.42 : 0.28); voices.bass(c, o, n[0] - 12, t, 0.34, d * 1.6); }
        if (s === 2 || s === 6) snare(c, o, t, 0.14);
        hat(c, o, t, 0.035);
        hat(c, o, t + d * 0.62, 0.018); // A late second hit gives the hats their swing.
      } },
    { id:'pop', name:{ id:'Pop', en:'Pop' }, bpm:100, lead:'lead', vol:0.2, level:1,
      chords:['Am','F','C','G','Am','F','C','G','C','G','Am','F','C','G','F','C'],
      melody:['E5 . E5 D5 C5 . A4 .','A4 C5 . C5 D5 . C5 .','G4 . G4 A4 C5 . E5 .','D5 . . C5 D5 . . .',
              'E5 . E5 G5 A5 . G5 E5','F5 . E5 D5 C5 . A4 .','G4 C5 . D5 E5 . D5 C5','D5 . . . . . . .',
              'G5 . G5 A5 G5 . E5 .','D5 . D5 E5 D5 . B4 .','C5 . C5 D5 E5 . G5 .','A5 . G5 . F5 . E5 .',
              'G5 . G5 A5 G5 . E5 .','D5 . D5 E5 G5 . D5 .','C5 . D5 E5 F5 . E5 D5','C5 . . . . . . .'],
      back(c, o, ch, s, t, d, pass, bar) {
        const n = chord(ch, 3), chorus = bar >= 8;
        n.forEach(m => voices.piano(c, o, m + (s % 2 ? 12 : 0), t, s % 2 ? 0.035 : 0.05, d * 1.8));
        if (s === 0) n.forEach(m => voices.pad(c, o, m, t, chorus ? 0.022 : 0.012, d * 8));
        if (s === 0 || s === 3 || s === 4) voices.bass(c, o, n[0] - 12, t, 0.3, d * 1.6);
        if (s === 0 || s === 4 || (chorus && s === 3)) kick(c, o, t, 0.34);
        if (s === 2 || s === 6) snare(c, o, t, chorus ? 0.14 : 0.1);
        hat(c, o, t, s % 2 ? 0.02 : 0.035);
      } },
  ];
  for (const tr of TRACKS) {
    tr.bars = tr.melody.map(b => b.split(' '));
    tr.stepDur = 30 / tr.bpm;
    tr.steps = tr.bars.length * 8 * 2;
  }
  const play = (ctx, out, tr, step, t) => {
    const i = step % tr.steps, count = tr.bars.length, bar = Math.floor(i / 8) % count, s = i % 8;
    const pass = Math.floor(i / (count * 8)), note = tr.bars[bar][s];
    if (note !== '.') {
      let hold = 1;
      while (s + hold < 8 && tr.bars[bar][s + hold] === '.') hold++;
      voices[tr.lead](ctx, out, midi(note), t, tr.vol, tr.stepDur * hold);
    }
    tr.back(ctx, out, tr.chords[bar], s, t, tr.stepDur, pass, bar);
  };
  return { TRACKS, play };
})();

// Every way a clue can sit on a line, stored as bit masks.
const placementCache = new Map();
function placements(clue) {
  const key = `${N}:${clue.join(',')}`;
  if (placementCache.has(key)) return placementCache.get(key);
  const out = [];
  const place = (i, from, mask) => {
    if (i === clue.length) { out.push(mask); return; }
    const need = clue.slice(i).reduce((a, b) => a + b, 0) + clue.length - i - 1;
    for (let at = from; at + need <= N; at++) {
      place(i + 1, at + clue[i] + 1, mask | (((1 << clue[i]) - 1) << at));
    }
  };
  place(0, 0, 0);
  placementCache.set(key, out);
  return out;
}

class Board {
  constructor(puzzle, grid) {
    this.puzzle = puzzle;
    this.grid = grid ? grid.map(r => r.slice()) : blankGrid();
    this.undoStack = [];
    this.stroke = null;
  }
  lineDone(i, isRow) {
    const line = isRow ? this.grid[i] : this.grid.map(r => r[i]);
    return same(runs(line.map(v => v === FILL ? 1 : 0)), isRow ? this.puzzle.rows[i] : this.puzzle.cols[i]);
  }
  // True when the line's marks can no longer fit its clue in any position.
  lineImpossible(i, isRow) {
    const line = isRow ? this.grid[i] : this.grid.map(r => r[i]);
    let fill = 0, cross = 0;
    line.forEach((v, j) => {
      if (v === FILL) fill |= 1 << j;
      if (v === CROSSED) cross |= 1 << j;
    });
    return !placements(isRow ? this.puzzle.rows[i] : this.puzzle.cols[i]).some(p => (p & fill) === fill && (p & cross) === 0);
  }
  // When a row or column touched by a move matches its numbers, cross its remaining empty squares.
  autoCross(cells) {
    let crossed = 0;
    const fill = (i, isRow) => {
      if (!this.lineDone(i, isRow)) return;
      for (let j = 0; j < N; j++) {
        const r = isRow ? i : j, c = isRow ? j : i;
        if (this.grid[r][c] === EMPTY) { this.grid[r][c] = CROSSED; crossed++; }
      }
    };
    new Set(cells.map(p => p.r)).forEach(r => fill(r, true));
    new Set(cells.map(p => p.c)).forEach(c => fill(c, false));
    return crossed;
  }

function rateDifficulty(p) {

      const sometimes = lines[i].reduce((a, m) => a | m, 0);

  const running = () => ctx && ctx.state === 'running';
  const choose = () => {
    if (save.track !== 'random') return MUSIC.TRACKS.find(tr => tr.id === save.track);
    const others = MUSIC.TRACKS.filter(tr => tr !== track);
    return others[Math.floor(Math.random() * others.length)];
  };
  const tick = () => {
    const now = ctx.currentTime;
    if (nextAt < now) nextAt = now + 0.05;
    while (nextAt < now + 0.4) {
      MUSIC.play(ctx, band, track, step++, nextAt);
      nextAt += track.stepDur;
      if (step >= track.steps) {
        step = 0;
        if (save.track === 'random') { track = choose(); nextAt += 0.8; } // A short breath between songs.
      }
    }
  };
  const stopBand = () => {
    if (!band) return;
    const old = band, now = ctx.currentTime;
    clearInterval(timer);
    old.gain.cancelScheduledValues(now);
    old.gain.setValueAtTime(old.gain.value, now);
    old.gain.linearRampToValueAtTime(0, now + 0.6);
    setTimeout(() => old.disconnect(), 800);
    band = null; timer = null;
  };
  const sync = () => {
    if (!running()) return;
    const on = wanted && save.music;
    if (on && !band) {
      band = ctx.createGain();
      band.gain.setValueAtTime(0, ctx.currentTime);
      band.gain.linearRampToValueAtTime(level, ctx.currentTime + 1);
      band.connect(ctx.destination);
      track = choose(); step = 0; nextAt = ctx.currentTime + 0.1;
      tick();
      timer = setInterval(tick, 100);
    } else if (on) {
      band.gain.cancelScheduledValues(ctx.currentTime);
      band.gain.setValueAtTime(band.gain.value, ctx.currentTime);
      band.gain.linearRampToValueAtTime(level, ctx.currentTime + 0.5);
    } else stopBand();
  };
  const unlock = () => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) { try { ctx = new AC(); } catch { return; } }
    if (away) return;
    if (ctx.state === 'suspended') ctx.resume().then(sync);
    else sync();
  };
  ['pointerdown', 'pointerup', 'touchend', 'keydown'].forEach(e => document.addEventListener(e, unlock, { passive: true }));
  let away = false;
  const setAway = hidden => {
    away = hidden;
    if (!ctx) return;
    if (hidden) ctx.suspend();
    else ctx.resume().then(sync);
  };
  document.addEventListener('visibilitychange', () => setAway(document.hidden));
  const blip = (type, from, to, dur, vol) => {
    if (!save.sfx || !running()) return;
    const now = ctx.currentTime;
    if (now - last < 0.04) return;
    last = now;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, now);
    osc.frequency.exponentialRampToValueAtTime(to, now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur);
  };
  return {
    [FILL]: () => blip('triangle', 300, 130, 0.1, 0.4),
    [CROSSED]: () => blip('square', 1500, 900, 0.05, 0.1),
    [EMPTY]: () => blip('sine', 520, 340, 0.05, 0.12),
    music(on, volume = 0.75) { wanted = on; level = volume; sync(); },
    setAway,
    changeTrack() { if (running()) stopBand(); sync(); },
    sync,
  };
})();

function label(scene, x, y, text, opts = {}) {
  const style = {
    fontFamily: opts.display ? DISPLAY : BODY,
    fontStyle: opts.weight || (opts.display ? '400' : '500'),
    fontSize: `${opts.size || 42}px`,
    color: opts.color || C.paper,
    align: opts.align || 'left',
  };
  if (opts.wrap) style.wordWrap = { width: opts.wrap };
  const t = scene.add.text(x, y, text, style);
  if (opts.lineSpacing) t.setLineSpacing(opts.lineSpacing);
  if (opts.shadow) t.setShadow(opts.shadow, opts.shadow, C.red, 0, false, true);
  return t;
}

// Icons are drawn with shapes, so they stay sharp and need no image files.
const ICONS = {
  fill(g, x, y, s, c) { g.fillStyle(c, 1); g.fillRoundedRect(x - s / 2, y - s / 2, s, s, s * 0.18); },
  cross(g, x, y, s, c) {
    const r = s * 0.42;
    g.lineStyle(s * 0.2, c, 1);
    g.lineBetween(x - r, y - r, x + r, y + r);
    g.lineBetween(x + r, y - r, x - r, y + r);
  },
  undo(g, x, y, s, c) {
    g.lineStyle(s * 0.15, c, 1);
    g.lineBetween(x - s * 0.24, y - s * 0.2, x + s * 0.12, y - s * 0.2);
    g.beginPath(); g.arc(x + s * 0.12, y + s * 0.06, s * 0.26, -Math.PI / 2, Math.PI / 2); g.strokePath();
    g.lineBetween(x + s * 0.12, y + s * 0.32, x - s * 0.28, y + s * 0.32);
    g.fillStyle(c, 1); g.fillTriangle(x - s * 0.5, y - s * 0.2, x - s * 0.18, y - s * 0.46, x - s * 0.18, y + s * 0.06);
  },
  reset(g, x, y, s, c) {
    g.lineStyle(s * 0.16, c, 1);
    g.beginPath(); g.arc(x, y, s * 0.38, -Math.PI * 0.4, Math.PI * 1.25); g.strokePath();
    g.fillStyle(c, 1); g.fillTriangle(x + s * 0.02, y - s * 0.56, x + s * 0.02, y - s * 0.06, x + s * 0.42, y - s * 0.34);
  },
  hint(g, x, y, s, c) {
    g.fillStyle(c, 1);
    g.fillCircle(x, y - s * 0.12, s * 0.32);
    g.fillRect(x - s * 0.15, y + s * 0.14, s * 0.3, s * 0.16);
    g.fillRect(x - s * 0.11, y + s * 0.34, s * 0.22, s * 0.1);
    g.lineStyle(s * 0.08, c, 1);
    g.lineBetween(x - s * 0.5, y - s * 0.14, x - s * 0.42, y - s * 0.14);
    g.lineBetween(x + s * 0.42, y - s * 0.14, x + s * 0.5, y - s * 0.14);
    g.lineBetween(x - s * 0.34, y - s * 0.46, x - s * 0.28, y - s * 0.4);
    g.lineBetween(x + s * 0.34, y - s * 0.46, x + s * 0.28, y - s * 0.4);
  },
  check(g, x, y, s, c) {
    g.lineStyle(s * 0.15, c, 1);
    g.strokeCircle(x - s * 0.09, y - s * 0.09, s * 0.3);
    g.lineStyle(s * 0.2, c, 1);
    g.lineBetween(x + s * 0.13, y + s * 0.13, x + s * 0.44, y + s * 0.44);
  },
  back(g, x, y, s, c) {
    g.lineStyle(s * 0.2, c, 1);
    g.lineBetween(x + s * 0.2, y - s * 0.38, x - s * 0.2, y);
    g.lineBetween(x - s * 0.2, y, x + s * 0.2, y + s * 0.38);
  },
  next(g, x, y, s, c) {
    g.lineStyle(s * 0.2, c, 1);
    g.lineBetween(x - s * 0.2, y - s * 0.38, x + s * 0.2, y);
    g.lineBetween(x + s * 0.2, y, x - s * 0.2, y + s * 0.38);
  },
  play(g, x, y, s, c) { g.fillStyle(c, 1); g.fillTriangle(x - s * 0.34, y - s * 0.44, x - s * 0.34, y + s * 0.44, x + s * 0.44, y); },
  plus(g, x, y, s, c) {
    g.lineStyle(s * 0.22, c, 1);
    g.lineBetween(x - s * 0.42, y, x + s * 0.42, y);
    g.lineBetween(x, y - s * 0.42, x, y + s * 0.42);
  },
  gear(g, x, y, s, c) {
    g.lineStyle(s * 0.14, c, 1);
    g.strokeCircle(x, y, s * 0.26);
    g.lineStyle(s * 0.16, c, 1);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      g.lineBetween(x + Math.cos(a) * s * 0.3, y + Math.sin(a) * s * 0.3, x + Math.cos(a) * s * 0.47, y + Math.sin(a) * s * 0.47);
    }
  },
  note(g, x, y, s, c) {
    g.fillStyle(c, 1);
    g.fillCircle(x - s * 0.18, y + s * 0.28, s * 0.17);
    g.fillRect(x - s * 0.05, y - s * 0.44, s * 0.12, s * 0.72);
    g.fillTriangle(x + s * 0.05, y - s * 0.44, x + s * 0.42, y - s * 0.2, x + s * 0.05, y - s * 0.12);
  },
  speaker(g, x, y, s, c) {
    g.fillStyle(c, 1);
    g.fillRect(x - s * 0.46, y - s * 0.16, s * 0.24, s * 0.32);
    g.fillTriangle(x - s * 0.26, y, x + s * 0.06, y - s * 0.4, x + s * 0.06, y + s * 0.4);
    g.lineStyle(s * 0.1, c, 1);
    g.beginPath(); g.arc(x + s * 0.06, y, s * 0.26, -0.8, 0.8); g.strokePath();
    g.beginPath(); g.arc(x + s * 0.06, y, s * 0.42, -0.8, 0.8); g.strokePath();
  },
  shuffle(g, x, y, s, c) {
    g.lineStyle(s * 0.13, c, 1);
    g.lineBetween(x - s * 0.48, y - s * 0.28, x + s * 0.24, y + s * 0.28);
    g.lineBetween(x - s * 0.48, y + s * 0.28, x + s * 0.24, y - s * 0.28);
    g.fillStyle(c, 1);
    g.fillTriangle(x + s * 0.18, y - s * 0.48, x + s * 0.5, y - s * 0.28, x + s * 0.18, y - s * 0.08);
    g.fillTriangle(x + s * 0.18, y + s * 0.08, x + s * 0.5, y + s * 0.28, x + s * 0.18, y + s * 0.48);
  },
  book(g, x, y, s, c) {
    g.fillStyle(c, 1);
    g.fillRect(x - s * 0.48, y - s * 0.36, s * 0.44, s * 0.7);
    g.fillRect(x + s * 0.04, y - s * 0.36, s * 0.44, s * 0.7);
  },
  globe(g, x, y, s, c) {
    g.lineStyle(s * 0.11, c, 1);
    g.strokeCircle(x, y, s * 0.42);
    g.lineBetween(x - s * 0.42, y, x + s * 0.42, y);
    g.strokeEllipse(x, y, s * 0.4, s * 0.84);
  },
};

function button(scene, x, y, w, h, text, onClick, opts = {}) {
  const look = { fill: hex(opts.fill || C.deep), strokeW: 0, strokeC: 0, color: opts.color || C.paper };
  const gfx = scene.add.graphics(), art = scene.add.graphics();
  const size = opts.size || 42, iconSize = size * 1.05, iconGap = size * 0.42;
  const txt = label(scene, x + w / 2, y + h / 2, text, { size, weight: '800', color: look.color }).setOrigin(0.5);
  const draw = () => {
    const pad = look.strokeW / 2, rad = (h - look.strokeW) / 2;
    gfx.clear();
    gfx.fillStyle(look.fill, 1);
    gfx.fillRoundedRect(x + pad, y + pad, w - look.strokeW, h - look.strokeW, rad);
    if (look.strokeW) {
      gfx.lineStyle(look.strokeW, look.strokeC, 1);
      gfx.strokeRoundedRect(x + pad, y + pad, w - look.strokeW, h - look.strokeW, rad);
    }
    art.clear();
    const cx = x + w / 2, cy = y + h / 2;
    if (!opts.icon) { txt.setPosition(cx, cy); return; }
    const full = iconSize + iconGap + (txt.width || 0), left = cx - full / 2;
    ICONS[opts.icon](art, left + iconSize / 2, cy, iconSize, hex(look.color));
    txt.setPosition(left + iconSize + iconGap + (txt.width || 0) / 2, cy);
  };
  draw();
  const hit = scene.add.zone(x + w / 2, y + h / 2, w, h).setInteractive({ useHandCursor: true });
  const b = {
    txt, enabled: true, onClick, art,
    rect: {
      setStrokeStyle(width, color) { look.strokeW = width; look.strokeC = color; draw(); },
      setFillStyle(color) { look.fill = color; draw(); },
    },
    layout() { draw(); return b; },
    setLabel(value) { txt.setText(value); draw(); return b; },
    setEnabled(v) { b.enabled = v; [gfx, art, txt].forEach(o => o.setAlpha(v ? 1 : 0.45)); return b; },
    setLook(fill, color) { look.fill = hex(fill); look.color = color; txt.setColor(color); draw(); return b; },
    setVisible(v) { [gfx, art, txt].forEach(o => o.setVisible(v)); hit.input.enabled = v; return b; },
    setDepth(d) { [gfx, art, txt].forEach(o => o.setDepth(d)); hit.setDepth(d); return b; },
    destroy() { [gfx, art, txt, hit].forEach(o => o.destroy()); },
    press() { if (b.enabled) onClick(); },
  };
  hit.on('pointerup', () => b.press());
  return b;
}

// Colour of one square in the solved picture. Puzzles with a detailed look also colour the background.
function revealColor(p, r, c) {
  if (p.look) return p.look.pal[p.look.rows[r][c]];
  const ch = p.art[r][c];
  return ch === '.' ? p.bg : (p.pal || PAL)[ch];
}

const MEDALS = { 3: ['#F2C230', '#B98A12'], 2: ['#D5DCE4', '#8C97A3'], 1: ['#D18B4F', '#8E5427'] };
function medal(scene, x, y, r, rank) {
  const [face, edge] = MEDALS[rank];
  const disc = scene.add.circle(x, y, r, hex(face)).setStrokeStyle(Math.max(4, r * 0.14), hex(edge));
  const star = scene.add.star(x, y, 5, r * 0.28, r * 0.62, hex(edge));
  return [disc.setDepth(3), star.setDepth(3)];
}

function artTexture(scene, p) {
  const key = `art-${p.id}`;
  if (scene.textures.exists(key)) return key;
  const size = p.art.length;
  const tex = scene.textures.createCanvas(key, size, size);
  const ctx = tex.getContext();
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    ctx.fillStyle = revealColor(p, r, c); ctx.fillRect(c, r, 1, 1);
  }
  tex.refresh();
  tex.setFilter(Phaser.Textures.FilterMode.NEAREST);
  return key;
}

class TitleScene extends Phaser.Scene {
  constructor() { super('Title'); }
  create() {
    sfx.music(true);
    this.layers = {};
    const names = ['sky', 'city', 'bus', 'stall', 'ojol', 'title'];
    const complete = names.every(n => titleImages[n]);
    if (complete) {
      names.forEach((n, i) => {
        const key = `title-${n}`;
        if (!this.textures.exists(key)) {
          this.textures.addImage(key, titleImages[n]);
          this.textures.get(key).setFilter(Phaser.Textures.FilterMode.NEAREST);
        }
        this.layers[n] = this.add.image(VW / 2, VH / 2, key).setDisplaySize(VW, VH).setDepth([0, 3, 4, 5, 6, 8][i]);
      });
    } else {
      label(this, VW / 2, 300, 'NonoIndo', { display: true, size: 136, color: C.yellow, shadow: 7 }).setOrigin(0.5);
    }
    this.moving = complete && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.moving) this.buildAnimation();
    const bw = 300, gap = 30, bx = (VW - bw * 3 - gap * 2) / 2, by = 1760, bh = 116;
    const last = PUZZLES.find(p => p.id === save.last);
    const style = (b, fill, color) => { b.setLook(fill, color); b.rect.setStrokeStyle(8, hex(C.ink)); b.txt.setFontFamily(DISPLAY).setFontStyle('400'); b.layout(); return b.setDepth(9); };
    this.btn = {
      cont: style(button(this, bx, by, bw, bh, t('Lanjut'), () => {
        const fresh = save.best[last.id] !== undefined && !save.grids[last.id];
        this.scene.start('Play', { puzzle: last, fresh });
      }, { size: 40, icon: 'play' }), C.yellow, C.ink).setEnabled(!!last),
      fresh: style(button(this, bx + bw + gap, by, bw, bh, t('Baru'), () => (save.introSeen ? this.scene.start('Categories') : this.scene.start('Guide', { kind: 'how', intro: true })), { size: 40, icon: 'plus' }), C.paper, C.ink),
      opts: style(button(this, bx + (bw + gap) * 2, by, bw, bh, t('Opsi'), () => this.scene.start('Options'), { size: 40, icon: 'gear' }), C.paper, C.ink),
    };
    label(this, VW / 2, by + bh + 22, `© binjesoft · v${VERSION}`, { size: 30, weight: '800', color: C.ink }).setOrigin(0.5).setDepth(9);
  }

  buildAnimation() {
    const PX = 8;
    // Stars twinkle at random in the dark part of the sky.
    for (let i = 0; i < 16; i++) {
      const star = this.add.rectangle(Phaser.Math.Between(1, 133) * PX, Phaser.Math.Between(1, 50) * PX, PX, PX, hex(C.paper)).setDepth(1);
      this.tweens.add({ targets: star, alpha: 0.1, duration: Phaser.Math.Between(500, 1400), delay: Phaser.Math.Between(0, 1500), yoyo: true, repeat: -1 });
    }
    // Clouds pass behind the skyline.
    const cloud = (y, cols) => {
      const g = this.add.graphics().setDepth(2);
      g.fillStyle(hex('#F7B7A3'), 0.85);
      [[3, 0, 9], [1, 1, 15], [0, 2, 24], [5, 3, 12]].forEach(([x, r, w]) => g.fillRect(x * PX, r * PX, w * PX, PX));
      g.y = y;
      return { g, x: cols * PX };
    };
    this.clouds = [cloud(88 * PX, 30), cloud(112 * PX, 100)];
    // Steam rises from the pot on the warung counter.
    this.steam = [0, 1, 2, 3].map(i => ({
      box: this.add.rectangle(0, 0, PX, PX, hex(C.paper)).setDepth(7),
      phase: i / 4, x: (i % 2 ? 17 : 12) * PX,
    }));
  }

  update(time, delta) {
    if (!this.moving) return;
    const PX = 8, snap = v => Math.round(v / PX) * PX;
    const loop = (ms, from, to) => from + ((time % ms) / ms) * (to - from);
    // Both vehicles drive left to right, off one edge and back in at the other.
    this.layers.bus.x = VW / 2 + snap(loop(14000, -130 * PX, 100 * PX));
    this.layers.ojol.x = VW / 2 + snap(loop(6000, -140 * PX, 45 * PX));
    this.layers.ojol.y = VH / 2 + (Math.floor(time / 180) % 2 ? PX : 0);
    this.layers.title.y = VH / 2 + snap(Math.sin(time / 800) * PX * 1.5);
    this.clouds.forEach(c => {
      c.x += delta * 0.03;
      if (c.x > VW) c.x = -26 * PX;
      c.g.x = snap(c.x);
    });
    this.steam.forEach(s => {
      const p = ((time / 1800) + s.phase) % 1;
      s.box.setPosition(s.x + snap(Math.sin(p * 9) * PX), 202 * PX - snap(p * 60));
      s.box.setAlpha(1 - p);
    });
  }
}

class PlayScene extends Phaser.Scene {
  constructor() { super('Play'); }
  init(data) {
    this.puzzle = data.puzzle;
    N = this.puzzle.art.length;
    const saved = !data.fresh && save.grids[this.puzzle.id];
    save.last = this.puzzle.id; store.write(save);
    this.board = new Board(this.puzzle, saved && saved.g);
    this.elapsed = saved ? saved.t : 0;
    this.tool = FILL; this.done = false; this.focus = null; this.keyCursor = false; this.lock = null; this.dialog = null; this.wrong = []; this.busy = false;
    this.used = { hint: !!(saved && saved.u && saved.u.hint), check: !!(saved && saved.u && saved.u.check) };
  }
  create() {
    sfx.music(save.playMusic, 0.4);
    const p = this.puzzle;
    this.btn = {};
    this.btn.back = button(this, MARGIN, 40, 240, 110, t('Kembali'), () => this.toHome(), { size: 38, icon: 'back' });

    const depth = Math.max(1, ...p.rows.map(c => c.length), ...p.cols.map(c => c.length));
    const cell = Math.floor(CONTENT / (N + depth * 0.6));
    this.geo = { cell, ox: MARGIN + CONTENT - cell * N, oy: BOARD_Y + CONTENT - cell * N };

    this.add.rectangle(VW / 2, BOARD_Y + CONTENT / 2, CONTENT, CONTENT, hex(C.paper));
    this.gfx = this.add.graphics().setDepth(1);
    this.buildClues();

    const ty = BOARD_Y + CONTENT + 36, half = (CONTENT - 30) / 2;
    this.btn.fill = button(this, MARGIN, ty, half, 140, t('Isi'), () => this.setTool(FILL), { size: 46, icon: 'fill' });
    this.btn.cross = button(this, MARGIN + half + 30, ty, half, 140, t('Silang'), () => this.setTool(CROSSED), { size: 46, icon: 'cross' });
    const ay = ty + 170, aw = (CONTENT - 30) / 2;
    this.btn.undo = button(this, MARGIN, ay, aw, 124, t('Urungkan'), () => this.doUndo(), { icon: 'undo' });
    this.btn.reset = button(this, MARGIN + aw + 30, ay, aw, 124, t('Ulang'), () => this.askReset(), { icon: 'reset' });
    this.btn.undo.setEnabled(false);
    const hy = ay + 150;
    this.btn.hint = button(this, MARGIN, hy, aw, 124, t('Petunjuk'), () => this.useHint(), { icon: 'hint', fill: C.paper, color: C.ink });
    this.btn.check = button(this, MARGIN + aw + 30, hy, aw, 124, t('Periksa'), () => this.useCheck(), { icon: 'check', fill: C.paper, color: C.ink });
    this.btn.hint.setEnabled(!this.used.hint);
    this.btn.check.setEnabled(!this.used.check);
    this.noteText = t('Geser jari untuk mengisi banyak kotak sekaligus. Ketuk angka untuk mengunci satu baris atau kolom.');
    this.note = label(this, MARGIN, hy + 150, this.noteText, { size: 36, color: C.soft, wrap: CONTENT, lineSpacing: 6 });
    this.setTool(FILL);

    this.input.on('pointerdown', q => this.onDown(q));
    this.input.on('pointermove', q => this.onMove(q));
    this.input.on('pointerup', () => this.onUp());
    this.input.on('pointerupoutside', () => this.onUp());
    this.input.keyboard && this.input.keyboard.on('keydown', e => this.onKey(e));

    this.ticker = this.time.addEvent({ delay: 1000, loop: true, callback: () => {
      if (this.done) return;
      this.elapsed++;
      this.clock.setText(fmt(this.elapsed));
      if (this.elapsed % 5 === 0) this.persist();
    } });

    this.events.once('shutdown', () => this.persist());
    this.paint();
  }

  buildClues() {
    const { cell, ox, oy } = this.geo, p = this.puzzle;
    const size = Math.round(cell * 0.56);
    const style = { size, weight: '800', color: C.ink };
    this.rowClues = []; this.colClues = [];
    for (let r = 0; r < N; r++) {
      const clue = p.rows[r].length ? p.rows[r] : [0];
      this.rowClues[r] = clue.slice().reverse().map((n, i) =>
        label(this, ox - cell * 0.18 - i * cell * 0.56, oy + r * cell + cell * 0.5, String(n), style).setOrigin(1, 0.5).setDepth(2));
    }
    for (let c = 0; c < N; c++) {
      const clue = p.cols[c].length ? p.cols[c] : [0];
      this.colClues[c] = clue.slice().reverse().map((n, i) =>
        label(this, ox + c * cell + cell / 2, oy - cell * 0.34 - i * cell * 0.62, String(n), style).setOrigin(0.5).setDepth(2));
    }
  }

  paint() {
    const g = this.gfx, { cell, ox, oy } = this.geo, grid = this.board.grid;
    g.clear();
    if (this.lock) {
      g.fillStyle(hex(C.yellow), 1);
      if (this.lock.type === 'row') g.fillRect(MARGIN, oy + this.lock.i * cell, CONTENT, cell);
      else g.fillRect(ox + this.lock.i * cell, BOARD_Y, cell, CONTENT);
    } else if (this.focus) {
      g.fillStyle(hex(C.hi), 1);
      g.fillRect(MARGIN, oy + this.focus.r * cell, CONTENT, cell);
      g.fillRect(ox + this.focus.c * cell, BOARD_Y, cell, CONTENT);
    }
    g.fillStyle(hex(C.pink), 1);
    for (let i = 0; i < N; i++) {
      if (this.board.lineImpossible(i, true)) g.fillRect(MARGIN, oy + i * cell, CONTENT, cell);
      if (this.board.lineImpossible(i, false)) g.fillRect(ox + i * cell, BOARD_Y, cell, CONTENT);
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = ox + c * cell, y = oy + r * cell, v = grid[r][c];
      if (v === FILL) { g.fillStyle(hex(C.filled), 1); g.fillRect(x, y, cell, cell); }
      if (v === CROSSED) {
        const m = cell * 0.28;
        g.lineStyle(Math.max(4, cell * 0.09), hex(C.red), 1);
        g.lineBetween(x + m, y + m, x + cell - m, y + cell - m);
        g.lineBetween(x + cell - m, y + m, x + m, y + cell - m);
      }
    }
    for (const major of [false, true]) {
      g.lineStyle(major ? 5 : 2, hex(major ? C.ink : C.line), 1);
      for (let i = 0; i <= N; i++) {
        if ((i % 5 === 0) !== major) continue;
        g.lineBetween(ox + i * cell, oy, ox + i * cell, oy + cell * N);
        g.lineBetween(ox, oy + i * cell, ox + cell * N, oy + i * cell);
      }
    }
    if (this.lock) {
      const size = cell * N, i = this.lock.i, row = this.lock.type === 'row';
      g.fillStyle(hex(C.paper), 0.55);
      if (row) {
        g.fillRect(ox, oy, size, i * cell);
        g.fillRect(ox, oy + (i + 1) * cell, size, (N - i - 1) * cell);
      } else {
        g.fillRect(ox, oy, i * cell, size);
        g.fillRect(ox + (i + 1) * cell, oy, (N - i - 1) * cell, size);
      }
      g.lineStyle(6, hex(C.red), 1);
      if (row) g.strokeRect(ox, oy + i * cell, size, cell);
      else g.strokeRect(ox + i * cell, oy, cell, size);
    }
    if (this.wrong.length) {
      g.lineStyle(8, hex(C.red), 1);
      this.wrong.forEach(p => g.strokeRect(ox + p.c * cell + 4, oy + p.r * cell + 4, cell - 8, cell - 8));
    }
    if (this.keyCursor && this.focus) {
      g.lineStyle(6, hex(C.red), 1);
      g.strokeRect(ox + this.focus.c * cell, oy + this.focus.r * cell, cell, cell);
    }
    for (let i = 0; i < N; i++) {
      const ra = this.board.lineDone(i, true) ? 0.32 : 1, ca = this.board.lineDone(i, false) ? 0.32 : 1;
      this.rowClues[i].forEach(t => t.setAlpha(ra));
      this.colClues[i].forEach(t => t.setAlpha(ca));
    }
  }

  cellAt(q) {
    const { cell, ox, oy } = this.geo;
    return { c: Math.floor((q.worldX - ox) / cell), r: Math.floor((q.worldY - oy) / cell) };
  }
  inLock(p) {
    if (!this.lock) return true;
    return this.lock.type === 'row' ? p.r === this.lock.i : p.c === this.lock.i;
  }
  toggleLock(type, i) {
    const same = this.lock && this.lock.type === type && this.lock.i === i;
    this.lock = same ? null : { type, i };
    this.focus = null;
    this.paint();
  }
  beginStroke(p) {
    this.wrong = [];
    this.board.begin(p, this.tool);
    if (this.lock) this.board.stroke.axis = this.lock.type === 'row' ? 'h' : 'v';
  }
  onDown(q) {
    if (this.done || this.dialog || this.busy) return;
    const p = this.cellAt(q);
    const inRows = p.r >= 0 && p.r < N, inCols = p.c >= 0 && p.c < N;
    if (p.c < 0 && inRows && q.worldX >= MARGIN) return this.toggleLock('row', p.r);
    if (p.r < 0 && inCols && q.worldY >= BOARD_Y) return this.toggleLock('col', p.c);
    if (!inRows || !inCols || !this.inLock(p)) return;
    this.keyCursor = false; this.focus = p;
    this.beginStroke(p);
    this.strokeSound();
    this.btn.undo.setEnabled(true);
    this.paint();
  }
  strokeSound() {
    const s = this.board.stroke;
    if (s.changed > s.heard) { s.heard = s.changed; sfx[s.paint](); }
  }
  onMove(q) {
    if (!this.board.stroke) return;
    const p = this.cellAt(q);
    this.focus = this.board.move({ r: Phaser.Math.Clamp(p.r, 0, N - 1), c: Phaser.Math.Clamp(p.c, 0, N - 1) });
    this.strokeSound();
    this.paint();
  }
  onUp() {
    if (!this.board.stroke) return;
    if (this.board.stroke.paint === FILL) this.board.autoCross(this.board.stroke.touched);
    this.board.end();
    this.persist();
    this.paint();
    if (this.board.isWon()) this.win();
  }
  onKey(e) {
    if (this.done || this.dialog || this.busy) return;
    const dir = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] }[e.key];
    const clamp = v => Math.min(N - 1, Math.max(0, v));
    if (dir) {
      e.preventDefault();
      this.keyCursor = true;
      this.focus = this.focus ? { r: clamp(this.focus.r + dir[0]), c: clamp(this.focus.c + dir[1]) } : { r: 0, c: 0 };
      this.paint();
    } else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      this.keyCursor = true;
      this.focus = this.focus || { r: 0, c: 0 };
      if (!this.inLock(this.focus)) return;
      this.beginStroke(this.focus);
      this.strokeSound();
      this.btn.undo.setEnabled(true);
      this.onUp();
    }
  }

  setTool(t2) {
    this.tool = t2;
    const look = (b, name, on) => {
      b.setLook(on ? C.yellow : C.deep, on ? C.ink : C.soft);
      b.setLabel(on ? `✓ ${name}` : name);
    };
    look(this.btn.fill, t('Isi'), t2 === FILL);
    look(this.btn.cross, t('Silang'), t2 === CROSSED);
  }
  useHint() {
    if (this.used.hint || this.done || this.dialog || this.busy) return;
    const p = this.board.pickHint();
    if (!p) return;
    this.used.hint = true;
    this.btn.hint.setEnabled(false);
    this.wrong = [];
    this.board.pushUndo();
    const value = this.board.want(p.r, p.c);
    this.board.grid[p.r][p.c] = value;
    if (value === FILL) this.board.autoCross([p]);
    sfx[value]();
    this.focus = p;
    this.btn.undo.setEnabled(true);
    this.note.setText(t('Petunjuk sudah dipakai untuk satu kotak.'));
    this.persist(); this.paint();
    if (!this.calm()) this.hintEffect(p);
    if (this.board.isWon()) this.win();
  }
  calm() { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
  hintEffect(p) {
    const { cell, ox, oy } = this.geo, x = ox + (p.c + 0.5) * cell, y = oy + (p.r + 0.5) * cell;
    const ring = this.add.rectangle(x, y, cell, cell).setStrokeStyle(10, hex(C.yellow)).setDepth(5).setScale(4).setAlpha(0);
    this.tweens.add({ targets: ring, scale: 1, alpha: 1, duration: 420, ease: 'Back.easeOut', yoyo: true, hold: 260, onComplete: () => ring.destroy() });
    const bulb = this.add.graphics().setDepth(6).setPosition(x, y);
    bulb.fillStyle(hex(C.deep), 1).fillCircle(0, 0, cell * 0.72);
    ICONS.hint(bulb, 0, 0, cell * 0.95, hex(C.yellow));
    this.tweens.add({ targets: bulb, y: y - cell * 1.8, alpha: 0, duration: 900, ease: 'Sine.easeOut', onComplete: () => bulb.destroy() });
    this.sparks(x, y, 18);
  }
  sparks(x, y, count) {
    this.ensureSpark();
    this.add.particles(x, y, 'confetti', {
      speed: { min: 120, max: 420 }, angle: { min: 0, max: 360 }, lifespan: 520,
      scale: { start: 0.9, end: 0 }, tint: [hex(C.yellow), hex(C.paper)], emitting: false,
    }).setDepth(6).explode(count);
  }
  ensureSpark() {
    if (this.textures.exists('confetti')) return;
    const tx = this.textures.createCanvas('confetti', 14, 14);
    const x = tx.getContext(); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 14, 14); tx.refresh();
  }
  useCheck() {
    if (this.used.check || this.done || this.dialog || this.busy) return;
    this.used.check = true;
    this.btn.check.setEnabled(false);
    const found = this.board.wrongCells();
    const finish = () => {
      this.busy = false;
      this.wrong = found;
      this.note.setText(found.length ? `${found.length} ${t('kotak salah ditandai merah.')}` : t('Semua kotak yang terisi sudah benar.'));
      this.persist(); this.paint();
      if (!this.calm()) this.checkResult(found);
    };
    if (this.calm()) { finish(); return; }
    this.busy = true;
    const { cell, ox, oy } = this.geo, size = cell * N;
    const beam = this.add.rectangle(ox + size / 2, oy, size, cell * 1.2, hex(C.yellow), 0.45).setDepth(5);
    const lens = this.add.graphics().setDepth(6).setPosition(ox - cell * 0.1, oy);
    lens.fillStyle(hex(C.deep), 1).fillCircle(0, 0, cell * 0.9);
    ICONS.check(lens, 0, 0, cell * 1.15, hex(C.yellow));
    this.tweens.add({ targets: [beam, lens], y: oy + size, duration: 760, ease: 'Sine.easeInOut', onComplete: () => { beam.destroy(); lens.destroy(); finish(); } });
    this.tweens.add({ targets: lens, x: ox + size * 0.9, duration: 190, yoyo: true, repeat: 1, ease: 'Sine.easeInOut' });
  }
  checkResult(found) {
    const { cell, ox, oy } = this.geo;
    if (!found.length) { this.sparks(ox + cell * N / 2, oy + cell * N / 2, 26); return; }
    found.forEach(p => {
      const box = this.add.rectangle(ox + (p.c + 0.5) * cell, oy + (p.r + 0.5) * cell, cell, cell, hex(C.red), 0.7).setDepth(5);
      this.tweens.add({ targets: box, alpha: 0, duration: 260, yoyo: true, repeat: 2, onComplete: () => box.destroy() });
    });
  }
  doUndo() {
    this.wrong = [];
    this.board.undo();
    this.btn.undo.setEnabled(this.board.undoStack.length > 0);
    this.persist(); this.paint();
  }
  askReset() {
    if (this.dialog) return;
    const w = 860, h = 500, x = (VW - w) / 2, y = BOARD_Y + 240, bw = 355, by = y + h - 170;
    const shade = this.add.rectangle(VW / 2, VH / 2, VW, VH, 0x000000, 0.6).setDepth(10).setInteractive();
    const panel = this.add.graphics().setDepth(11);
    panel.fillStyle(hex(C.deep), 1).fillRoundedRect(x, y, w, h, 40);
    panel.lineStyle(8, hex(C.yellow), 1).strokeRoundedRect(x, y, w, h, 40);
    const title = label(this, VW / 2, y + 110, t('Ulang puzzle ini?'), { display: true, size: 54, color: C.yellow }).setOrigin(0.5).setDepth(12);
    const body = label(this, VW / 2, y + 210, t('Semua kotak akan dikosongkan.'), { size: 42, color: C.paper }).setOrigin(0.5).setDepth(12);
    const close = () => {
      [shade, panel, title, body].forEach(o => o.destroy());
      no.destroy(); yes.destroy();
      this.dialog = null;
    };
    const no = button(this, x + 50, by, bw, 120, t('Batal'), close, { icon: 'cross' }).setDepth(12);
    const yes = button(this, x + w - 50 - bw, by, bw, 120, t('Ulang'), () => { close(); this.doReset(); }, { icon: 'reset', fill: C.red }).setDepth(12);
    this.dialog = { no, yes };
  }
  doReset() {
    this.wrong = [];
    this.board.reset();
    this.board.undoStack = []; // Undo must not bring back a board after the hints were refilled.
    this.btn.undo.setEnabled(false);
    this.used = { hint: false, check: false };
    this.btn.hint.setEnabled(true);
    this.btn.check.setEnabled(true);
    this.note.setText(this.noteText);
    this.persist(); this.paint();
  }
  persist() {
    if (this.done) return;
    save.grids[this.puzzle.id] = { g: this.board.grid, t: this.elapsed, u: this.used };
    store.write(save);
  }
  toHome() {
    const page = Math.floor(catOf(this.puzzle.cat).puzzles.indexOf(this.puzzle) / PER_PAGE);
    this.scene.start('Home', { cat: this.puzzle.cat, page });
  }

  win() {
    this.done = true;
    this.ticker.remove();
    const id = this.puzzle.id, best = save.best[id], isBest = best === undefined || this.elapsed < best;
    if (isBest) save.best[id] = this.elapsed;
    this.rank = 3 - (this.used.hint ? 1 : 0) - (this.used.check ? 1 : 0);
    save.medals[id] = Math.max(save.medals[id] || 0, this.rank);
    delete save.grids[id];
    store.write(save);
    this.focus = null;
    this.titleText.setText(t('Selesai!'));
    ['fill', 'cross', 'undo', 'reset', 'hint', 'check'].forEach(k => this.btn[k].setVisible(false));
    this.note.setVisible(false);
    this.result = isBest ? `${t('Waktu')} ${fmt(this.elapsed)} · ${t('rekor baru')}` : `${t('Waktu')} ${fmt(this.elapsed)} · ${t('rekor')} ${fmt(best)}`;

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      this.gfx.clear();
      [...this.rowClues, ...this.colClues].flat().forEach(t => t.setVisible(false));
      this.add.image(VW / 2, BOARD_Y + CONTENT / 2, artTexture(this, this.puzzle)).setDisplaySize(CONTENT, CONTENT).setDepth(3);
      this.showResult();
      return;
    }
    this.playReveal();
  }

  playReveal() {
    const { cell, ox, oy } = this.geo, p = this.puzzle, half = cell * N / 2;
    const stage = this.add.container(ox + half, oy + half).setDepth(3);
    const grid = this.board.grid;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = c * cell + cell / 2 - half, y = r * cell + cell / 2 - half, ch = p.art[r][c];
      const under = this.add.rectangle(x, y, cell + 1, cell + 1, hex(grid[r][c] === FILL ? C.filled : C.paper));
      const top = this.add.rectangle(x, y, cell + 1, cell + 1, hex(revealColor(p, r, c))).setScale(0);
      stage.add([under, top]);
      const mid = (N - 1) / 2, d = Math.hypot(r - mid, c - mid) / (mid * 1.42);
      this.tweens.add({ targets: top, scale: 1, delay: d * 550, duration: 280, ease: 'Back.easeOut' });
    }
    this.gfx.clear();
    this.tweens.add({ targets: [...this.rowClues, ...this.colClues].flat(), alpha: 0, duration: 300 });
    this.tweens.add({
      targets: stage, x: VW / 2, y: BOARD_Y + CONTENT / 2, scale: CONTENT / (cell * N),
      delay: 850, duration: 450, ease: 'Cubic.easeOut',
      onComplete: () => { this.confetti(); this.showResult(); },
    });
  }

  confetti() {
    this.ensureSpark();
    const em = this.add.particles(VW / 2, BOARD_Y + CONTENT / 2, 'confetti', {
      speed: { min: 350, max: 1000 }, angle: { min: 0, max: 360 }, gravityY: 1100,
      lifespan: 1200, scale: { start: 1.3, end: 0.3 }, rotate: { min: 0, max: 360 },
      tint: [hex(C.yellow), hex(C.red), hex(C.paper), hex(this.puzzle.bg)], emitting: false,
    }).setDepth(4);
    em.explode(70);
  }

  showResult() {
    const p = this.puzzle, y = BOARD_Y + CONTENT + 36, list = catOf(p.cat).puzzles, idx = list.indexOf(p);
    label(this, MARGIN, y, p.name, { display: true, size: 74, color: C.yellow, shadow: 5 });
    label(this, MARGIN, y + 100, p.caption, { size: 46, weight: '700', wrap: CONTENT, lineSpacing: 6 });
    label(this, MARGIN, y + 250, this.result, { size: 38, color: C.soft });
    medal(this, VW - MARGIN - 48, y + 272, 46, this.rank);
    label(this, VW - MARGIN - 110, y + 272, t(['', 'Perunggu', 'Perak', 'Emas'][this.rank]), { size: 40, weight: '800', color: C.yellow }).setOrigin(1, 0.5);
    const by = y + 320, w = (CONTENT - 30) / 2;
    this.btn.again = button(this, MARGIN, by, w, 124, t('Main lagi'), () => this.scene.restart({ puzzle: p, fresh: true }), { icon: 'reset' });
    this.btn.next = button(this, MARGIN + w + 30, by, w, 124, idx < list.length - 1 ? t('Lanjut') : t('Lihat koleksi'), () => {
      const n = list[idx + 1];
      if (n) this.scene.start('Play', { puzzle: n, fresh: save.best[n.id] !== undefined });
      else this.toHome();
    }, { icon: 'next', fill: C.yellow, color: C.ink });
  }
}

function boot() {
  window.nonoGame = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: VW, height: VH,
    backgroundColor: C.blue,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 2 },
    banner: false,
    scene: [TitleScene, OptionsScene, GuideScene, CategoriesScene, HomeScene, PlayScene],
  });
}
// Android app only: the back button goes back one screen, and sound stops in the background.
function androidHooks(game) {
  const cap = window.Capacitor;
  if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
  const App = (cap.Plugins && cap.Plugins.App) || (cap.registerPlugin && cap.registerPlugin('App'));
  if (!App) return;
  App.addListener('appStateChange', state => sfx.setAway(!state.isActive));
  App.addListener('backButton', () => {
    const scene = game.scene.getScenes(true)[0];
    if (!scene) return;
    if (scene.dialog) { scene.dialog.no.press(); return; }
    if (scene.scene.key === 'Title') { App.exitApp(); return; }
    const exit = scene.btn && (scene.btn.back || scene.btn.skip);
    if (exit) exit.press();
    else scene.scene.start('Title');
  });
}

boot();
androidHooks(window.nonoGame);
}
</script>

<script>
(() => {
  const urls = [
    'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js',
    'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js',
  ];
  const fail = () => { document.getElementById('fail').hidden = false; };
  const startGame = () => Promise.all([fontsReady, titleReady]).then(() => {
    try { start(); } catch (e) { console.error(e); fail(); }
  });
  function load(i) {
    if (i >= urls.length) return fail();
    const s = document.createElement('script');
    s.src = urls[i];
    s.onload = startGame;
    s.onerror = () => load(i + 1);
    document.head.append(s);
  }
  load(0);
})();
</script>
